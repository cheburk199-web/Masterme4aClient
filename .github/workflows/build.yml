name: Build Masterme4a Client

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '16'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.3.3'

      - name: Extract project
        run: |
         unzip -q Masterme4aClient-Forge-1.17.1-auto-build-fixed.zip -d project
          cd project/Masterme4aClient-Forge-1.17.1
          gradle --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Masterme4aClient
          path: project/Masterme4aClient-Forge-1.17.1/build/libs/*.jar
